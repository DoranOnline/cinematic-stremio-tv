name: Build Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: stremio-web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore stable Android signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/stremio-tv/android/app/update-signing.keystore"
          chmod 600 "$GITHUB_WORKSPACE/stremio-tv/android/app/update-signing.keystore"

      - name: Build web UI
        working-directory: stremio-web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec jest --runInBand
          pnpm lint
          pnpm build

      - name: Build Android APK
        working-directory: stremio-tv
        env:
          CINEMATIC_SIGNING_STORE_FILE: ${{ github.workspace }}/stremio-tv/android/app/update-signing.keystore
          CINEMATIC_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CINEMATIC_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CINEMATIC_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          npm ci
          npm run sync
          cd android
          chmod +x gradlew
          ./gradlew signingReport testDebugUnitTest assembleDebug

      - name: Name APK
        run: cp stremio-tv/android/app/build/outputs/apk/debug/app-debug.apk "Cinematic-Stremio-TV-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: Cinematic-Stremio-TV-${{ github.ref_name }}.apk
          generate_release_notes: true
