name: Build Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: stremio-web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web UI
        working-directory: stremio-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --runInBand
          pnpm lint
          pnpm build

      - name: Build Android APK
        working-directory: stremio-tv
        run: |
          npm ci
          npm run sync
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Name APK
        run: cp stremio-tv/android/app/build/outputs/apk/debug/app-debug.apk "Cinematic-Stremio-TV-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: Cinematic-Stremio-TV-${{ github.ref_name }}.apk
          generate_release_notes: true
